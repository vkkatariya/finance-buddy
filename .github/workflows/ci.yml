name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend — Typecheck · Lint · Build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || hashFiles('web/package.json') != '' }}
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm run check
      - run: pnpm run lint
      - run: pnpm run build

  backend:
    name: Backend — Typecheck · Build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || hashFiles('api/package.json') != '' }}
    defaults:
      run:
        working-directory: ./api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: api/pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm run check
      - run: pnpm run build

  schema:
    name: Drizzle — Generate + Push (dry-run)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || hashFiles('api/package.json') != '' }}
    defaults:
      run:
        working-directory: ./api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: api/pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm run db:generate
      - run: pnpm run db:push --dry-run
        env:
          DATABASE_URL: postgresql://test:***@localhost:5432/test

  # DEVLOG check: backstop for --no-verify and cloud sessions (AGENTS-WORKFLOW section 7).
  devlog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: DEVLOG touched
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx 'tasks/DEVLOG.md' || {
            echo "::error::Add a DEVLOG entry at the top of tasks/DEVLOG.md (format: AGENTS-WORKFLOW section 7)."
            exit 1
          }
