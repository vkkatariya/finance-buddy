name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  detect:
    name: Detect web/ and api/ scaffolds
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.files.outputs.web }}
      api: ${{ steps.files.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - id: files
        run: |
          for d in web api; do
            if [ -f "$d/package.json" ]; then echo "$d=true" >> "$GITHUB_OUTPUT"; else echo "$d=false" >> "$GITHUB_OUTPUT"; fi
          done

  frontend:
    name: Frontend — Typecheck · Lint · Build
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.web == 'true'
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm run check
      - run: pnpm run lint
      - run: pnpm run build

  backend:
    name: Backend — Typecheck · Build
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.api == 'true'
    defaults:
      run:
        working-directory: ./api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: api/pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm run check
      - run: pnpm run build

  schema:
    name: Drizzle — Generate + Push (dry-run)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.api == 'true'
    defaults:
      run:
        working-directory: ./api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: api/pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm run db:generate
      - run: pnpm run db:push --dry-run
        env:
          DATABASE_URL: postgresql://test:***@localhost:5432/test